.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 16px}

.recap b{font-family:var(--font-mono);font-weight:500;font-size:18px}

details.log{margin-top:2px}

.acct{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}

.slot .t{min-width:0}.slot .t b{display:block;font-weight:600}.slot small{display:block;color:var(--muted);font-size:13px}

.tabs{display:flex;gap:6px;margin:14px 0 4px}

/* ---------- accounts and saves ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ITER=200000,LS_ACC='groundlevel.accounts.v2';
const Backend={mode:'local',db:null,ready:false};
let Acct=null;
const te=new TextEncoder(),td=new TextDecoder();
const b64=u=>{u=new Uint8Array(u);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hasCrypto=()=>!!(window.crypto&&window.crypto.subtle);
async function sha256hex(s){const h=await crypto.subtle.digest('SHA-256',te.encode(s));return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const emailId=e=>sha256hex('ground-level:'+e.trim().toLowerCase());
async function deriveKey(pw,salt,iter){
  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj)));return {iv:b64(iv),ct:b64(ct)}}
async function unseal(key,box){return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(box.iv)},key,unb64(box.ct))))}

function lsAll(){try{return JSON.parse(localStorage.getItem(LS_ACC))||{}}catch(e){return {}}}
async function readDoc(id){
  if(Backend.mode==='cloud'){const s=await Backend.db.doc('accounts/'+id).get();return s.exists?s.data():null}
  return lsAll()[id]||null;
}
async function writeDoc(id,doc){
  if(Backend.mode==='cloud')return Backend.db.doc('accounts/'+id).set(doc);
  const a=lsAll();a[id]=doc;localStorage.setItem(LS_ACC,JSON.stringify(a));
}
async function removeDoc(id){
  if(Backend.mode==='cloud')return Backend.db.doc('accounts/'+id).delete();
  const a=lsAll();delete a[id];localStorage.setItem(LS_ACC,JSON.stringify(a));
}
const normSlots=a=>[0,1,2].map(i=>(a&&a[i])||null);
async function initBackend(){
  try{
    if(window.claude&&window.claude.use){
      const db=await window.claude.use('db');
      if(db){Backend.mode='cloud';Backend.db=db}
    }
  }catch(e){}
  Backend.ready=true;refreshUi();
}
function refreshUi(){if(S.phase==='title'||S.phase==='pick')render();else document.getElementById('strip').innerHTML=stripHtml()}

async function registerAccount(email,pw,name){
  const id=await emailId(email),salt=crypto.getRandomValues(new Uint8Array(16));
  const key=await deriveKey(pw,salt,ITER);
  const box=await seal(key,{name,slots:[null,null,null],t:Date.now()});
  const doc={v:2,salt:b64(salt),iter:ITER,box};
  if(Backend.mode==='cloud'){
    const ref=Backend.db.doc('accounts/'+id);
    const pre=await ref.get();
    if(pre.exists&&pre.data().salt)throw new Error('exists');
    const lease=await ref.acquire({holder:b64(crypto.getRandomValues(new Uint8Array(9))),ttlMs:8000});
    if(!lease.acquired)throw new Error('busy');
    const cur=await ref.get();
    if(cur.exists&&cur.data().salt)throw new Error('exists');
  }else if(lsAll()[id])throw new Error('exists');
  await writeDoc(id,doc);
  Acct={id,key,salt:doc.salt,iter:ITER,name,slots:[null,null,null],q:Promise.resolve(),note:''};
}
async function loginAccount(email,pw){
  const id=await emailId(email),doc=await readDoc(id);
  if(!doc||!doc.salt)throw new Error('bad');
  const key=await deriveKey(pw,unb64(doc.salt),doc.iter||ITER);
  let data;try{data=await unseal(key,doc.box)}catch(e){throw new Error('bad')}
  Acct={id,key,salt:doc.salt,iter:doc.iter||ITER,name:data.name||'Player',slots:normSlots(data.slots),q:Promise.resolve(),note:''};
}
function queueSave(){
  const a=Acct;if(!a)return;
  a.q=a.q.then(async()=>{
    try{
      const box=await seal(a.key,{name:a.name,slots:a.slots,t:Date.now()});
      await writeDoc(a.id,{v:2,salt:a.salt,iter:a.iter,box});
      if(a.note){a.note='';refreshUi()}
    }catch(e){a.note='Your progress could not be saved. If you are playing online, ask the page owner for Contributor access.';refreshUi()}
  });
}
function persist(n,data){if(!Acct)return;Acct.slots[n-1]=data;queueSave()}
const cloneRun=()=>JSON.parse(JSON.stringify(S,(k,v)=>(k==='ev'||k==='res'||k==='led'||k==='fight')?null:v));
function autosave(){
  if(!S.slot||!Acct)return;
  persist(S.slot,{v:1,kind:'run',savedAt:Date.now(),sum:{shop:TYPES[S.type].name,day:S.day,cash:S.cash},state:cloneRun()});
}
function saveEnded(){
  persist(S.slot,{v:1,kind:'ended',savedAt:Date.now(),sum:{shop:TYPES[S.type].name,day:S.day,cash:S.cash,title:S.endTitle||'Finished',outcome:S.over}});
}
function loadSlot(n){
  const d=Acct&&Acct.slots[n-1];if(!d||d.kind!=='run'||!d.state)return;
  S=JSON.parse(JSON.stringify(d.state));S.slot=n;S.phase='brief';S.menuConfirm=false;
  if(!S.weapons)S.weapons=startWeapons(S.type);
  if(S.kits===undefined)S.kits=1;
}
async function submitAuth(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:''};
  const reg=S.authTab==='register',email=g('f-email').trim(),pw=g('f-pw'),name=g('f-name').trim();
  S.authEmail=email;S.authName=name;S.authMsg='';
  const fail=m=>{S.authMsg=m;render()};
  if(!hasCrypto())return fail('This browser cannot run secure accounts. Try a current version of Chrome, Safari, Firefox or Edge.');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return fail('Enter a valid email address.');
  if(pw.length<8)return fail('Use a password with at least 8 characters.');
  if(reg){
    if(!name)return fail('Pick a display name.');
    if(pw!==g('f-pw2'))return fail('The two passwords do not match.');
  }
  const btn=document.getElementById('authgo');if(btn){btn.disabled=true;btn.textContent='Working…'}
  try{
    if(reg)await registerAccount(email,pw,name.slice(0,24));else await loginAccount(email,pw);
  }catch(e){
    const m=e&&e.message;
    return fail(m==='exists'?'An account with that email already exists. Try logging in.':m==='busy'?'Someone is creating that account right now. Try again in a moment.':m==='bad'?"That email and password don't match an account.":'Could not reach the account store. Check your connection and try again.');
  }
  S={phase:'title',day:1,threat:3};render();
}

  if(!Backend.ready)return '<div class="panel"><div class="kicker">Halvard residents only</div><h2>Connecting…</h2><p class="note">Checking where accounts are stored.</p></div>';
  const reg=S.authTab==='register';
  const where=Backend.mode==='cloud'?'Accounts live online, so you can play from any device.':'This page is not connected to online storage, so accounts live on this device only.';
  return `<div class="panel"><div class="kicker">Halvard residents only</div><h2>${reg?'Create an account':'Log in to your shop'}</h2>
    <div class="tabs"><button class="mini ${reg?'':'main'}" data-act="tab" data-t="login">Log in</button><button class="mini ${reg?'main':''}" data-act="tab" data-t="register">Create account</button></div>
    <form id="authform" class="auth">
      ${reg?`<label>Display name<input id="f-name" name="name" maxlength="24" autocomplete="nickname" value="${esc(S.authName||'')}"></label>`:''}
      <label>Email<input id="f-email" name="email" type="email" autocomplete="email" value="${esc(S.authEmail||'')}"></label>
      <label>Password<input id="f-pw" name="password" type="password" autocomplete="${reg?'new-password':'current-password'}"></label>
      ${reg?'<label>Confirm password<input id="f-pw2" name="password2" type="password" autocomplete="new-password"></label>':''}
      <button class="primary" id="authgo" type="submit">${reg?'Create account':'Log in'}</button>
    </form>
    ${S.authMsg?`<p class="err" role="alert">${esc(S.authMsg)}</p>`:''}
    <p class="note">${where} Your saves are encrypted with your password before they are stored. This is a game account, separate from claude.ai. There is no email verification and no password reset, so a forgotten password means the saves are gone. Do not reuse a password from anywhere else.</p></div>`;
}

  if(!Acct)return '<span class="acct">Not signed in</span>';
  return `<span class="acct">${esc(Acct.name)}${Acct.note?' · not saving':''}</span><button class="mini" data-act="logout">Log out</button>`;

function slotsHtml(){
  const when=t=>t?new Date(t).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
  const who=`Signed in as ${esc(Acct.name)}. ${Backend.mode==='cloud'?'Saves are encrypted with your password and stored online.':'Saves are encrypted and stored on this device.'}`;
  const rows=[1,2,3].map(n=>{
    const d=Acct.slots[n-1],sm=(d&&d.sum)||{};
    if(S.confirmDel===n)return `<div class="slot"><div class="t"><b>Delete slot ${n}?</b><small>This removes ${d&&d.kind==='run'?esc(sm.shop||'the game')+', day '+sm.day:'this finished game'} for good.</small></div><div class="slotbtns"><button class="mini danger" data-act="delyes" data-n="${n}">Delete</button><button class="mini" data-act="delno">Keep it</button></div></div>`;
    if(!d)return `<div class="slot"><div class="t"><b>Slot ${n} · Empty</b><small>A fresh start in Halvard.</small></div><div class="slotbtns"><button class="mini main" data-act="pickslot" data-n="${n}">New game</button></div></div>`;
    if(d.kind==='run')return `<div class="slot"><div class="t"><b>Slot ${n} · ${esc(sm.shop||'Shop')}</b><small>Day ${sm.day} of ${LAST} · ${fmt(sm.cash||0)} · saved ${when(d.savedAt)}</small></div><div class="slotbtns"><button class="mini main" data-act="load" data-n="${n}">Continue</button><button class="mini" data-act="del" data-n="${n}">Delete</button></div></div>`;
    return `<div class="slot"><div class="t"><b>Slot ${n} · ${esc(sm.title||'Finished')}</b><small>${sm.outcome==='win'?'Survived':'Ended'} on day ${sm.day} · ${esc(sm.shop||'')}</small></div><div class="slotbtns"><button class="mini main" data-act="pickslot" data-n="${n}">Start over</button><button class="mini" data-act="del" data-n="${n}">Delete</button></div></div>`;
  }).join('');
  const del=S.confirmAcct
    ?`<p class="note">Delete ${esc(Acct.name)} and all three slots for good?</p><div class="slotbtns"><button class="mini danger" data-act="acctdelyes">Delete account</button><button class="mini" data-act="acctdelno">Keep it</button></div>`
    :`<p class="note"><button class="mini" data-act="acctdel">Delete this account</button></p>`;
  return `<p class="note" style="margin-top:0">${who}</p>${Acct.note?`<p class="err">${esc(Acct.note)}</p>`:''}<div class="slots">${rows}</div>${del}`;

/* ---------- state ---------- */
let S={phase:'title',day:1,threat:3};
const snap=()=>({cash:S.cash,health:S.health,stress:S.stress,shop:S.shop,good:S.good,open:S.open,rent:S.rent});
function diff(a){const b=snap(),out=[];for(const k of ['cash','health','stress','shop','good','open','rent']){const v=b[k]-a[k];if(k==='open'?Math.abs(v)>.001:Math.round(v)!==0)out.push([k,v])}return out}
const LBL={health:'Health',stress:'Stress',shop:'Shop',good:'Goodwill'};
function chips(d){
  if(!d.length)return '';
  return '<div class="chips">'+d.map(([k,v])=>{
    const n=Math.round(v);let txt,bad;
    if(k==='cash'){txt=(n>0?'+':'−')+'$'+Math.abs(n);bad=n<0}
    else if(k==='open'){txt='Open hours −'+Math.round(Math.abs(v)*100)+'%';bad=v<0}
    else if(k==='rent'){txt='Rent '+(n>0?'+':'−')+'$'+Math.abs(n);bad=n>0}
    else{txt=LBL[k]+' '+(n>0?'+':'−')+Math.abs(n);bad=k==='stress'?n>0:n<0}
    return `<span class="chip ${bad?'bad':'ok'}">${txt}</span>`}).join('')+'</div>';
}
function applyFx(fx){
  for(const k in fx){let v=fx[k];
    if(k==='shop'&&v<0&&S.insured)v=Math.round(v/2);
    if(k==='open'){S.open=clamp(S.open+v,.1,1);continue}
    if(k==='rent'){S.rent+=v;continue}
    S[k]+=v}
  S.cash=Math.max(0,S.cash);S.health=clamp(S.health);S.stress=clamp(S.stress);S.shop=clamp(S.shop);S.good=clamp(S.good);
}
const check=()=>S.health<=0?'hospital':S.stress>=100?'burnout':S.shop<=0?'wrecked':null;
const dayName=d=>DAYS[(d-1)%7];
const hist=t=>S.hist.push({d:S.day,t});

function newGame(typeId,slot){
  S={type:typeId,slot:slot,phase:'brief',day:1,cash:240,health:92,stress:22,shop:75,good:50,rent:450,weapons:startWeapons(typeId),kits:1,fight:null,owed:0,insured:false,claims:[],seen:[],hist:[],flags:{},
     tally:{hurt:0,late:0,dmg:0,claims:0,rents:0,won:0},open:1,res:null,ev:null,led:null,notes:[],carry:[],over:null,threat:1,disrupted:null,news:''};
  startDay();
}
function startDay(){
  S.open=1;S.notes=S.carry.slice();S.carry=[];S.led=null;S.res=null;S.ev=null;S.over=null;S.phase='brief';
  const arc=[2,2,3,3,4,3,4,3,4,4,5,4,5,5];
  let t=arc[S.day-1];const j=rand();if(j<.25)t++;else if(j<.45)t--;
  S.threat=clamp(t,1,5);
  S.disrupted=S.threat>=3?pick(['subway','bus','bike']):null;
  S.news=pick(S.threat<=2?H1:S.threat===3?H2:H3);
  const keep=[];
  for(const c of S.claims){
    if(c.day<=S.day){
      if(rand()<c.p){S.cash+=c.amt;S.tally.claims+=c.amt;S.notes.push(`Relief check arrived: +${fmt(c.amt)}. The envelope is stamped Processed With Regret.`)}
      else S.notes.push('Your relief claim came back denied. Reason code: Ambient.')
    }else keep.push(c)
  }
  S.claims=keep;
  if(S.stress>70){applyFx({health:-3});S.notes.push('Your stress is running hot. You slept badly and your body noticed. Health −3.')}
  else if(S.stress<=40)S.health=clamp(S.health+2);
  S.over=check();if(S.over)S.phase='end';else autosave();
}
function nextDay(){
  if(S.day>=LAST){S.over='win';S.phase='end';return}
  S.day++;startDay();
}

/* ---------- commute ---------- */
function commuteState(c){
  const closed=(c.id==='subway'&&S.disrupted==='subway'&&S.threat>=4)||(c.id==='bus'&&S.disrupted==='bus'&&S.threat>=5);
  return {closed,dis:S.disrupted===c.id,cost:c.cost(S.threat)};
}
function doCommute(id){
  const c=COMMUTES.find(x=>x.id===id),th=S.threat,st=commuteState(c),before=snap();
  S.cash=Math.max(0,S.cash-st.cost);
  const ph=1.2*(c.hb+c.hk*th+(st.dis?.12:0)),pl=c.lb+.05*th+(st.dis?.18:0),r=rand();
  let kind='ok';if(r<ph)kind='hurt';else if(r<ph+pl)kind='late';
  if(kind==='ok'){if(id==='bike'){S.health=clamp(S.health+2);S.stress=clamp(S.stress-3)}else if(id==='walk')S.stress=clamp(S.stress-2)}
  if(kind==='late'){S.open=clamp(S.open-c.lose,.1,1);S.stress=clamp(S.stress+6);S.tally.late++}
  if(kind==='hurt'){S.health=clamp(S.health-Math.round(7+rand()*7+th*1.5));S.stress=clamp(S.stress+10);S.open=clamp(S.open-.1,.1,1);S.tally.hurt++}
  const word={ok:'Made it',late:'Running late',hurt:'Rough ride'}[kind];
  S.res={title:`${c.name} · ${word}`,text:pick(c.tx[kind]),chips:chips(diff(before))};
  hist(`${c.name}: ${word.toLowerCase()}.`);
  S.over=check();S.phase='commute_res';
}

/* ---------- midday ---------- */
function pickEvent(){
  const ok=e=>S.threat>=e.t[0]&&S.threat<=e.t[1]&&!(e.once&&S.flags['seen_'+e.id]);
  let pool=EVENTS.filter(e=>ok(e)&&!S.seen.includes(e.id));
  if(!pool.length){S.seen=[];pool=EVENTS.filter(ok)}
  const e=pick(pool);S.seen.push(e.id);if(e.once)S.flags['seen_'+e.id]=true;return e;
}
const need=c=>Math.max(0,-(c.fx.cash||0),-((c.ffx||{}).cash||0));
function doChoice(i){
  const c=S.ev.c[i],before=snap();
  if(c.fight!==undefined){startFight(c.fight);return}
  let ok=true;if(c.p!==undefined)ok=rand()<c.p;
  applyFx(ok?c.fx:(c.ffx||{}));
  if(ok&&c.fn)c.fn();
  S.res={title:c.l,text:ok?c.t:c.ft,chips:chips(diff(before))};
  hist(`${S.ev.k}: ${c.l.toLowerCase()}.`);
  S.over=check();S.phase='event_res';
}

/* ---------- evening ---------- */
function enterEvening(){
  const T=TYPES[S.type];S.phase='evening';
  let rev=(50+S.good*.9+S.shop*.7)*T.rev*(1.1-.08*S.threat+T.boost*S.threat)*S.open*(S.flags.noMachine?.85:1)*(S.stress>70?.9:1)*(.88+rand()*.24)*.92;
  rev=Math.max(0,Math.round(rev));const sup=Math.round(rev*.3),util=T.util,net=rev-sup-util;
  S.cash+=net;let skipped=false;
  if(S.cash<0){S.cash=0;skipped=true;S.stress=clamp(S.stress+8);S.health=clamp(S.health-4)}
  let col=null;
  if(rand()<.15*S.threat){const d=Math.round((6+rand()*10)*T.dmg*(S.insured?.5:1));S.shop=clamp(S.shop-d);S.tally.dmg+=d;col={d,text:pick(COLL)}}
  S.led={rev,sup,util,net,skipped,col};
  hist(`Closed the day ${net>=0?'up':'down'} ${fmt(Math.abs(net))}.`);
  S.over=check();
}
function eveActions(){
  const T=TYPES[S.type];
  return [
    {id:'repair',l:'Repair and restock',s:'Patch cracks, sweep up, fill the shelves.',h:`−$${T.repair} · Shop +15`,need:T.repair},
    {id:'late',l:'Stay open late',s:'The night owls need you. Your knees disagree.',h:'+cash · Stress +9'},
    {id:'rest',l:'Lock up and go home',s:'Eat something warm, sitting down.',h:'Stress −12 · Health +7'},
    {id:'stoop',l:'Hand out leftovers on the stoop',s:'Neighbors you only nod to learn your name.',h:'−$15 · Goodwill +8',need:15},
    {id:'claim',l:'File Hero Damage Relief Form 27-B',s:'Eleven pages. Page nine asks if the damage was witnessed.',h:'45% for $220 in 3 days',req:S.day-(S.flags.lastClaim||-9)>=3&&S.claims.length<2,rq:'Already pending'},
    {id:'loan',l:'Call your sister for a loan',s:'She will say yes. She will also say be careful.',h:'+$150 once',req:!S.flags.loan,rq:'Already borrowed'},
    {id:'kit',l:'Restock the first-aid kit',s:'Gauze, tape, and the good painkillers.',h:'−$25 · +1 kit (max 3)',need:25,req:S.kits<3,rq:'Kit shelf is full'},
    {id:'bat',l:'Buy an aluminum bat',s:'Better reach, better swing, lasts longer than a broom.',h:'−$55 · 11–16 damage',need:55,req:!S.weapons.some(w=>w.name==='Aluminum bat'),rq:'Already behind the counter'}
  ];
}
function doEve(id){
  const T=TYPES[S.type],before=snap();let text='';
  switch(id){
    case 'repair':S.cash-=T.repair;S.shop=clamp(S.shop+15);S.stress=clamp(S.stress-2);text='You tape, patch, sweep, and restock until the place looks like it expects to be open tomorrow.';break;
    case 'late':{const extra=Math.round(S.led.rev*.35*(.85+rand()*.3));S.cash+=extra;S.stress=clamp(S.stress+9);S.health=clamp(S.health-3);text="You keep the lights on for the night owls and the people who can't go home yet. The register is better for it. Your knees are not.";break}
    case 'rest':S.stress=clamp(S.stress-12);S.health=clamp(S.health+7);text='You lock up at six and take the long way home. Distant booms sound like furniture moving upstairs.';break;
    case 'stoop':S.cash=Math.max(0,S.cash-15);S.good=clamp(S.good+8);S.stress=clamp(S.stress-3);text='You hand out the day-old stock on the stoop. Somebody asks your name and remembers it.';break;
    case 'claim':S.claims.push({day:S.day+3,p:.45,amt:220});S.flags.lastClaim=S.day;S.stress=clamp(S.stress+4);text='You list the whole block as witnesses. Page eleven asks you to sign in two places and a third, just in case.';break;
    case 'loan':S.cash+=150;S.flags.loan=true;S.stress=clamp(S.stress+6);text='Your sister sends $150 and a voice message that is mostly breathing and then "be careful." You save the message.';break;
    case 'kit':S.cash-=25;S.kits=Math.min(3,S.kits+1);text='You restock the kit from the pharmacy aisle and hide the good painkillers behind the till.';break;
    case 'bat':S.cash-=55;S.weapons.push({name:'Aluminum bat',min:11,max:16,acc:.78,dur:8});text='You buy it from a man who says it has never been used for baseball. It lives under the counter now.';break;
  }
  text+=' '+pick(NIGHT);
  S.res={title:'',text,chips:chips(diff(before))};
  S.over=check();S.phase='eve_res';
}

/* ---------- skirmishes ---------- */
const BROOM={name:'Push broom',min:5,max:9,acc:.85,dur:7};
const SIGNATURE={
  coffee:{name:'Cast-iron skillet',min:9,max:14,acc:.7,dur:6},
  hardware:{name:'Pipe wrench',min:10,max:15,acc:.72,dur:7},
  laundromat:{name:'Mop bucket and wringer',min:8,max:13,acc:.75,dur:7}
};
const startWeapons=id=>[{...BROOM},{...SIGNATURE[id]}];
const ENEMIES=[
  {name:'Opportunistic looter',hp:22,atk:[4,8],acc:.6,pay:30,intro:'He has a crowbar and the confidence of someone who has watched a lot of videos.'},
  {name:'Teal-jumpsuit grunt',hp:30,atk:[6,10],acc:.65,pay:55,intro:'The break is over. He pulls a baton from his belt and does not look happy about it.'},
  {name:'Rustjaw scrap-drone',hp:38,atk:[8,13],acc:.65,pay:70,intro:'A chewed-up drone the size of a dishwasher grinds through your doorframe, jaws clicking.'},
  {name:'Static-charged enforcer',hp:46,atk:[9,15],acc:.7,pay:90,intro:'Every hair on your arms stands up. He walks in like the room owes him a favor.'},
  {name:"The Gridlock's bruiser",hp:55,atk:[11,17],acc:.7,pay:110,intro:'He fills the doorway. Somewhere behind him, a bus is on its side.'}
];
const fightChance=()=>S.threat>=3?.18+.07*S.threat:S.threat===2?.1:0;
function startFight(idx){
  const i=idx!==undefined?idx:clamp(S.threat-2+(rand()<.4?1:0),0,4);
  const e={...ENEMIES[i]};e.max=e.hp;
  S.fight={e,log:[e.intro],round:1,brace:false,before:snap()};S.phase='fight';
}
function fightAct(a){
  const F=S.fight,e=F.e,L=[];F.brace=false;
  if(a==='fist'||a[0]==='w'){
    const wi=a==='fist'?-1:+a.slice(1),w=wi<0?{name:'bare hands',min:2,max:5,acc:.9,dur:99}:S.weapons[wi];
    if(rand()<w.acc){const d=Math.round(w.min+rand()*(w.max-w.min));e.hp=Math.max(0,e.hp-d);L.push(`You hit with the ${w.name} for ${d}.`)}
    else L.push(`Your swing with the ${w.name} misses.`);
    if(wi>=0){w.dur--;if(w.dur<=0){L.push(`The ${w.name} breaks.`);S.weapons.splice(wi,1)}}
  }else if(a==='brace'){F.brace=true;L.push('You get low behind the counter and cover up.')}
  else if(a==='kit'){S.kits--;S.health=clamp(S.health+18);L.push('You slap on a bandage and a very strong painkiller. Health +18.')}
  else if(a==='run'){
    if(rand()<.55){F.log=L;endFight('fled');return}
    L.push('You turn to run and he cuts you off.');
  }
  F.log=L;
  if(e.hp<=0){endFight('won');return}
  if(rand()<e.acc*(F.brace?.5:1)){
    let d=Math.round(e.atk[0]+rand()*(e.atk[1]-e.atk[0]));if(F.brace)d=Math.round(d*.6);
    S.health=clamp(S.health-d);S.shop=clamp(S.shop-(S.insured?1:2));L.push(`The ${e.name.toLowerCase()} hits you for ${d}. Something on a shelf breaks.`);
  }else L.push(`The ${e.name.toLowerCase()} swings and misses.`);
  S.stress=clamp(S.stress+2);F.round++;
  if(check()){endFight('lost');return}
  if(F.round>9)endFight('draw');
}
function endFight(kind){
  const F=S.fight,e=F.e;let title,text;const lg=F.log.join(' ');
  if(kind==='won'){applyFx({cash:e.pay,good:5,stress:-4});S.tally.won++;title='Skirmish · You held the line';text=`${lg} The ${e.name.toLowerCase()} backs off, then runs. You find ${fmt(e.pay)} in the dropped gear.`}
  else if(kind==='fled'){applyFx({cash:-20,good:-4,open:-.3,stress:4});title='Skirmish · You got out';text=`${lg} You squeeze out through the stockroom and watch from the alley. It costs you some stock, and some pride.`}
  else if(kind==='draw'){applyFx({good:2,stress:4});title='Skirmish · Standoff';text=`${lg} Both of you run out of steam. He wanders off, muttering about the schedule.`}
  else{title='Skirmish · Down';text=`${lg} The world goes white, then a ceiling.`}
  S.res={title,text,chips:chips(diff(F.before))};
  hist(`Skirmish with ${e.name.toLowerCase()}: ${kind==='won'?'won':kind==='fled'?'fled':kind==='draw'?'standoff':'lost'}.`);
  S.over=check();S.fight=null;S.phase='event_res';
}
function fightHtml(){
  const F=S.fight,e=F.e;
  const ws=S.weapons.map((w,i)=>choiceBtn(`data-act="fight" data-a="w${i}"`,`Swing the ${w.name}`,`${w.min}–${w.max} damage · ${Math.round(w.acc*100)}% to hit`,`${w.dur} uses left`,false)).join('');
  return `<div class="panel"><div class="kicker">Skirmish · round ${F.round}</div><h2>${e.name}</h2>
    <div class="stat"><div class="row"><span>Their strength</span><b>${e.hp}/${e.max}</b></div><div class="bar bad"><i style="width:${e.hp/e.max*100}%"></i></div></div>
    <div class="stat"><div class="row"><span>Your health</span><b>${Math.round(S.health)}</b></div><div class="bar ${S.health<35?'bad':'good'}"><i style="width:${S.health}%"></i></div></div>
    <p class="lead">${F.log.join(' ')}</p><h3>Your move</h3><div class="choices">${ws}${choiceBtn('data-act="fight" data-a="fist"','Shove and swing with your bare hands','2–5 damage · 90% to hit','')}${choiceBtn('data-act="fight" data-a="brace"','Brace behind the counter','Their hits land half as often and hurt less.','')}${choiceBtn('data-act="fight" data-a="kit"','Use a first-aid kit','Heals 18 health.',`${S.kits} left`,S.kits<1)}${choiceBtn('data-act="fight" data-a="run"','Back out through the stockroom','About 55% you get away. Failing gives him a free swing.','−$20 stock')}</div></div>`;
}

/* ---------- rent ---------- */
const due=()=>S.rent+S.owed;
function payRent(){S.cash-=due();S.owed=0;S.tally.rents++;hist(`Paid rent.`);nextDay()}
function sellAsset(){S.cash+=260;S.flags.noMachine=true;S.stress=clamp(S.stress+8)}
function takeLoan(){S.cash+=150;S.flags.loan=true;S.stress=clamp(S.stress+6)}
function plead(){
  const p=.25+S.good/200;
  if(rand()<p){
    const d=due();S.owed=d-S.cash+50;S.cash=0;S.flags.pleaded=true;S.stress=clamp(S.stress+4);S.tally.rents++;
    S.carry.push(`Mr. Abernathy took what you had and wrote the rest on a sticky note, plus a $50 late fee. You now owe ${fmt(S.owed)}.`);
    hist('Paid part of the rent and begged for time.');nextDay();
  }else{S.over='evicted';S.phase='end'}
}

/* ---------- scene ---------- */
function fig(x,y,body,cape){
  return `<g transform="translate(${x},${y})"><path d="M0,-9 L-13,6 L-2,3 Z" style="fill:${cape}" opacity=".85"/><circle cx="0" cy="-14" r="4" style="fill:${body}"/><path d="M0,-10 L0,6 M0,-6 L-7,-1 M0,-6 L8,-13 M0,6 L-4,15 M0,6 L5,14" fill="none" style="stroke:${body}" stroke-width="2.6" stroke-linecap="round"/></g>`;
}
function sceneSvg(){
  const th=S.type||S.phase==='end'?S.threat:3,day=S.day||1,r=rng(day*7919+31),W=800,H=240,G=196;
  let o=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMid slice" role="img" aria-label="Halvard skyline with a rooftop battle at threat level ${th} of 5">`;
  o+=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky-a)"/><stop offset="1" style="stop-color:var(--sky-b)"/></linearGradient><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter></defs>`;
  o+=`<rect width="${W}" height="${H}" fill="url(#sky)"/>`;
  let x=-10;while(x<W){const w=34+r()*40,h=60+r()*85;o+=`<rect x="${x.toFixed(1)}" y="${(G-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" style="fill:var(--far)"/>`;x+=w+2+r()*4}
  x=-20;while(x<W){const w=46+r()*50,h=44+r()*74,y=G-h;o+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" style="fill:var(--near)"/>`;
    for(let wy=y+8;wy<G-8;wy+=12)for(let wx=x+6;wx<x+w-8;wx+=12)if(r()<.26)o+=`<rect x="${wx.toFixed(1)}" y="${wy.toFixed(1)}" width="5" height="6" style="fill:var(--win)" opacity=".8"/>`;
    x+=w+3}
  const bx=270+r()*170,by=74;
  o+=`<g class="beam"><line x1="${bx-64}" y1="${by-2}" x2="${bx+66}" y2="${by+6}" style="stroke:var(--beam)" stroke-width="${3+th*2}" filter="url(#glow)" opacity=".85"/><line x1="${bx-64}" y1="${by-2}" x2="${bx+66}" y2="${by+6}" style="stroke:var(--beam)" stroke-width="${1+th*.5}"/></g>`;
  o+=fig(bx-70,by,'var(--blue)','var(--blue)')+fig(bx+72,by+6,'var(--alert)','var(--alert)');
  for(let i=0;i<th;i++){
    const cx=60+r()*640,cy=40+r()*110,rad=8+th*2.6+r()*8;let p='';
    for(let k=0;k<12;k++){const a=k*Math.PI/6,rr=k%2?rad*.5:rad;p+=`${(cx+Math.cos(a)*rr).toFixed(1)},${(cy+Math.sin(a)*rr).toFixed(1)} `}
    o+=`<circle cx="${cx.toFixed(1)}" cy="${(cy-rad-6).toFixed(1)}" r="${(rad*.8).toFixed(1)}" style="fill:var(--smoke)" opacity=".4"/><circle cx="${(cx+10).toFixed(1)}" cy="${(cy-rad-18).toFixed(1)}" r="${(rad*.6).toFixed(1)}" style="fill:var(--smoke)" opacity=".3"/>`;
    o+=`<polygon points="${p}" style="fill:var(--boom)" opacity=".92"/><circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(rad*.35).toFixed(1)}" style="fill:var(--beam)"/>`;
  }
  o+=`<rect y="${G}" width="${W}" height="${H-G}" style="fill:var(--street)"/>`;
  for(let d=10;d<W;d+=60)o+=`<rect x="${d}" y="${G+30}" width="26" height="3" style="fill:var(--win)" opacity=".45"/>`;
  /* the shop */
  const sx=56,sy=G-74,sw=128,sh=74,sc=S.shop===undefined?75:S.shop;
  o+=`<rect x="${sx}" y="${sy}" width="${sw}" height="${sh}" style="fill:var(--wall)"/>`;
  for(let k=0;k<8;k++)o+=`<rect x="${sx-4+k*17}" y="${sy-2}" width="17" height="16" style="fill:${k%2?'var(--panel)':'var(--blue)'}"/>`;
  o+=`<rect x="${sx+10}" y="${sy+24}" width="58" height="42" style="fill:var(--street)" opacity=".85"/><rect x="${sx+14}" y="${sy+28}" width="50" height="34" style="fill:var(--win)" opacity="${sc<30?.2:.6}"/>`;
  o+=`<rect x="${sx+82}" y="${sy+28}" width="30" height="46" style="fill:var(--near)"/>`;
  if(sc<65)o+=`<path d="M${sx+22},${sy+28} l8,14 l-6,6 l10,14" fill="none" style="stroke:var(--street)" stroke-width="2"/>`;
  if(sc<40)o+=`<rect x="${sx+10}" y="${sy+36}" width="58" height="7" style="fill:var(--warn)" transform="rotate(-6 ${sx+39} ${sy+40})"/><rect x="${sx+10}" y="${sy+50}" width="58" height="7" style="fill:var(--warn)" transform="rotate(4 ${sx+39} ${sy+54})"/>`;
  if(sc<20)o+=`<path d="M${sx+sw},${sy} l-30,0 l-10,30 l20,-4 z" style="fill:var(--street)" opacity=".7"/>`;
  /* you, with a bag */
  o+=`<g transform="translate(${sx+sw+26},${G+4})"><circle cy="-30" r="5" style="fill:var(--ink)"/><path d="M0,-24 L0,-4 M0,-20 L-8,-10 M0,-20 L8,-12 M0,-4 L-5,10 M0,-4 L6,10" fill="none" style="stroke:var(--ink)" stroke-width="3" stroke-linecap="round"/><rect x="7" y="-14" width="10" height="12" rx="1" style="fill:var(--blue)"/></g>`;
  o+=`<rect width="${W}" height="${H}" fill="var(--night)" opacity="${S.phase==='evening'||S.phase==='eve_res'||S.phase==='rent'?.28:0}"/>`;
  return o+'</svg>';
}

/* ---------- render ---------- */
const $=id=>document.getElementById(id);
function render(){
  $('strip').innerHTML=stripHtml();
  $('scene').innerHTML=sceneSvg();
  const playing=!!S.type;
  $('main').classList.toggle('solo',!playing);
  $('side').innerHTML=playing?sideHtml():'';
  $('desk').innerHTML=deskHtml();
  $('log').innerHTML=playing&&S.hist.length?logHtml():'';
}
function stripHtml(){
  let right='';
  if(S.type&&S.phase!=='end'){
    const th=S.threat,cls=th>=4?'max':th===3?'hot':'';
    const step=['brief','commute_res'].includes(S.phase)?0:['event','event_res','fight'].includes(S.phase)?1:2;
    right=`<div class="meta"><span class="day">${DAYS_FULL[(S.day-1)%7]} · Day ${S.day} of ${LAST}</span>
      <span class="threat ${cls}" title="Hero activity: ${LEVELS[th]}" aria-label="Hero activity ${LEVELS[th]}">${[1,2,3,4,5].map(i=>`<i class="${i<=th?'on':''}" style="height:${6+i*3}px"></i>`).join('')}</span>
      <span>Hero activity: ${LEVELS[th]}</span>${acctHtml()}<button class="mini" data-act="menu">${S.menuConfirm?'Leave? Progress since this morning is lost':'Menu'}</button>
      <span class="pips">${['Commute','Midday','Close'].map((p,i)=>`<span class="${i===step?'on':''}">${p}</span>`).join('')}</span></div>`;
  }else right=`<div class="meta"><span>Halvard, a city with a lot going on overhead</span>${acctHtml()}</div>`;
  return `<div class="brand"><span class="roundel" aria-hidden="true"></span>Ground Level</div>${right}`;
}
function bar(label,val,cls){return `<div class="stat"><div class="row"><span>${label}</span><b>${Math.round(val)}</b></div><div class="bar ${cls}"><i style="width:${clamp(val)}%"></i></div></div>`}
function sideHtml(){
  const nr=RENT_DAYS.find(d=>d>=S.day)||LAST,dl=nr-S.day;

}
function logHtml(){
  return `<details class="log"><summary>Logbook (${S.hist.length})</summary><ul>${S.hist.slice().reverse().map(h=>`<li><b>${dayName(h.d)}</b>${h.t}</li>`).join('')}</ul></details>`;
}
function choiceBtn(attrs,label,sub,hint,disabled,tag){
  return `<button class="choice" ${attrs} ${disabled?'disabled':''}><span class="t"><b>${label}${tag||''}</b>${sub?`<small>${sub}</small>`:''}</span>${hint?`<span class="h">${hint}</span>`:''}</button>`;
}
function deskHtml(){
  const P=S.phase;
  if(P==='title'&&(!Acct||!Backend.ready))return authHtml();
  if(P==='title'){
    return `<div class="panel"><div class="kicker">A week-by-week survival game</div><h2>You are not the hero. You own a shop.</h2>
      <p class="lead">Halvard is under constant rooftop attack. You still have to get to work, keep the lights on, and pay Mr. Abernathy on Sunday. When a fight reaches your door, you use what's behind the counter. Weapons wear out, bandages run out, and so does your luck. Survive two weeks and two rent days.</p>
      <p class="note">Each day: pick how you commute, handle one thing that happens at midday, then close up. Cash, health, stress, your shop, and your neighbors all push back.</p>
      <h3>Your saves</h3>${slotsHtml()}</div>`;
  }
  if(P==='pick'){
    return `<div class="panel"><button class="mini" data-act="back">Back to saves</button><div class="kicker" style="margin-top:14px">Slot ${S.pendingSlot}</div><h2>Pick your shop</h2><p class="note">The game saves at the start of every day.</p><h3>Choose one</h3><div class="types">${Object.values(TYPES).map(t=>`<button class="choice" data-act="start" data-type="${t.id}"><span class="t"><b>${t.name}</b><small>${t.blurb}</small></span></button>`).join('')}</div></div>`;
  }
  if(P==='brief'){
    const notes=S.notes.length?`<p class="note">${S.notes.join(' ')}</p>`:'';
    return `<div class="panel"><div class="kicker">${DAYS_FULL[(S.day-1)%7]} morning</div><h2>${S.news}</h2>${notes}
      <h3>How do you get to the shop?</h3><div class="choices">${COMMUTES.map(c=>{
        const st=commuteState(c),tag=st.closed?'<span class="tag">Closed</span>':st.dis?'<span class="tag warn">Disrupted</span>':'';
        const hint=`${st.cost?fmt(st.cost):'Free'} · ${c.time}`;
        return choiceBtn(`data-act="commute" data-id="${c.id}"`,c.name,st.closed?'Service suspended today.':c.desc,hint,st.closed||st.cost>S.cash,tag)}).join('')}</div></div>`;
  }
  if(P==='commute_res'||P==='event_res'||P==='eve_res'){
    const r=S.res,nxt=P==='commute_res'?'toEvent':P==='event_res'?'toEvening':'afterEve';
    const lbl=S.over?'See what happens':P==='commute_res'?'On to the shop':P==='event_res'?'Close up for the day':RENT_DAYS.includes(S.day)?'Rent day':S.day>=LAST?'Finish':'Next morning';
    return `<div class="panel">${r.title?`<div class="kicker">${r.title}</div>`:'<div class="kicker">Night</div>'}<p class="lead">${r.text}</p>${r.chips}<button class="primary" data-act="${nxt}">${lbl}</button></div>`;
  }
  if(P==='event'){
    const e=S.ev;
    return `<div class="panel"><div class="kicker">Midday · ${e.k}</div><h2>${e.h}</h2><p class="lead">${e.x}</p><h3>What do you do?</h3><div class="choices">${e.c.map((c,i)=>{
      const n=need(c),bad=(c.req&&!c.req())||n>S.cash;
      const hint=[n?'−$'+n:'',c.p!==undefined?'a gamble':''].filter(Boolean).join(' · ');
      return choiceBtn(`data-act="choice" data-i="${i}"`,c.l,bad?(c.req&&!c.req()?c.rq:"Can't afford that"):'',hint,bad)}).join('')}</div></div>`;
  }
  if(P==='evening'){
    const L=S.led,T=TYPES[S.type];
    const rows=`<tr><td>Sales${S.open<.95?` (open ~${Math.round(S.open*100)}% of hours)`:''}</td><td>${fmt(L.rev)}</td></tr><tr><td>Supplies</td><td>−${fmt(L.sup).replace('−','')}</td></tr><tr><td>Utilities and groceries</td><td>−${fmt(L.util).replace('−','')}</td></tr><tr class="net"><td>Net for the day</td><td>${L.net>=0?'+':''}${fmt(L.net)}</td></tr>`;
    const extras=(L.col?`<p class="note"><b style="color:var(--alert)">Collateral damage (shop −${L.col.d}).</b> ${L.col.text}</p>`:'')+(L.skipped?'<p class="note">The till couldn\'t cover everything. You skipped dinner. Stress +8, Health −4.</p>':'');
    if(S.over)return `<div class="panel"><div class="kicker">Closing time</div><h2>The day's numbers</h2><table class="ledger">${rows}</table>${extras}<button class="primary" data-act="afterEve">See what happens</button></div>`;
    return `<div class="panel"><div class="kicker">Closing time</div><h2>The day's numbers</h2><table class="ledger">${rows}</table>${extras}
      <h3>Before you lock up</h3><div class="choices">${eveActions().map(a=>{
        const bad=(a.req===false)||(a.need&&a.need>S.cash);
        return choiceBtn(`data-act="eve" data-id="${a.id}"`,a.l,bad?(a.req===false?a.rq:"Can't afford that"):a.s,a.h,bad)}).join('')}</div></div>`;
  }
  if(P==='rent'){
    const d=due(),can=S.cash>=d,asset=TYPES[S.type].asset;
    const pp=Math.round((.25+S.good/200)*100);
    let opts='';
    if(can)opts=choiceBtn('data-act="pay"',`Pay ${fmt(d)}`,'Mr. Abernathy counts it twice and says thank you once.','');
    else opts=`<p class="note">You have ${fmt(S.cash)}. You're ${fmt(d-S.cash)} short.</p><h3>Options</h3><div class="choices">`
      +choiceBtn('data-act="sell"',`Sell ${asset}`,'Quick cash. Your sales will run about 15% lower from now on.','+$260 · Stress +8',!!S.flags.noMachine)
      +choiceBtn('data-act="loan"','Call your sister for a loan','She will say yes.','+$150 · Stress +6',!!S.flags.loan)
      +choiceBtn('data-act="plead"','Ask Mr. Abernathy for time',`Pay what you have now. He adds a $50 late fee. About ${pp}% he agrees, depending on how the neighbors see you.`,'once',!!S.flags.pleaded)
      +choiceBtn('data-act="giveup"','Hand over the keys','You pack what fits in a duffel bag.','')+'</div>';
    return `<div class="panel"><div class="kicker">Rent day</div><h2>${fmt(d)} due tonight</h2><p class="lead">Mr. Abernathy is on the stairs with the receipt book. ${S.owed?'He looks at the sticky note from last week and then at you.':'He asks how the shop is holding up. You both look at the ceiling.'}</p>${opts}${can?'<div class="choices" style="margin-top:12px"></div>':''}</div>`;
  }
  if(P==='fight')return fightHtml();
  if(P==='end')return endHtml();
  return '';
}
function endHtml(){
  const o=S.over,t=S.tally;
  const E={
    hospital:['bad','Admitted',"You wake up in a hallway bed at St. Brannock's. The nurse says half the ward is on your postal code. The shop stays shut for a month. Maybe next time, take the car."],
    burnout:['bad','Closed for Good',"You lock the door, put the key through the mail slot, and take a long bus to your cousin's place in Tulsa. The sky there is boring. You cry about it, a little, in a good way."],
    wrecked:['bad','Total Loss',"The back wall comes down at 4:12. The sign survives. You're holding it when the adjuster arrives, and neither of you says anything for a while."],
    evicted:['bad','Notice to Vacate',"The duffel bag is heavy but not as heavy as you expected. Mr. Abernathy holds the door. \"For what it's worth,\" he says. He doesn't finish."]
  };
  let tone,title,text;
  if(o==='win'){
    tone='good';
    if(S.owed>0){title='Behind, But Open';text="Two weeks, two rent days, one sticky note. The shop is still open and so are you. Next month will be a real negotiation."}
    else if(S.good>=70){title='The Block Remembers';text="When the cordon finally lifts, the neighbors carry a banner to your door. It says THANK YOU in handwriting that's almost legible. You hang it above the register."}
    else if(S.cash>=500){title='Solvent, Somehow';text="You count the cash twice, because it's strange to have extra. The sky above Halvard keeps breaking. You buy a second broom."}
    else if(S.stress>=70||S.health<35){title='Standing, Barely';text="You made it. Your hands shake when you turn the sign to OPEN, but the sign turns. That counts."}
    else{title='Still Open';text="Two weeks. Two rents. A city that treats the sky like a trampoline, and a shop that is still here. That is the whole story, and it is a good one."}
  }else[tone,title,text]=E[o];
  S.endTitle=title;
  const recap=o==='win'||true?`<div class="recap">
    <div><span>Cash</span><b>${fmt(S.cash||0)}</b></div><div><span>Health</span><b>${Math.round(S.health||0)}</b></div>
    <div><span>Stress</span><b>${Math.round(S.stress||0)}</b></div><div><span>Shop</span><b>${Math.round(S.shop||0)}</b></div>
    <div><span>Goodwill</span><b>${Math.round(S.good||0)}</b></div><div><span>Rents paid</span><b>${t.rents}/2</b></div>
    <div><span>Rough commutes</span><b>${t.hurt}</b></div><div><span>Late openings</span><b>${t.late}</b></div>
    <div><span>Collateral damage</span><b>${t.dmg}</b></div><div><span>Relief paid</span><b>${fmt(t.claims)}</b></div><div><span>Fights won</span><b>${t.won}</b></div></div>`:'';
  return `<div class="panel end ${tone}"><div class="kicker">${o==='win'?`Day ${LAST} complete`:`Day ${S.day}`}</div><h2>${title}</h2><p class="lead">${text}</p>${recap}<button class="primary" data-act="restart">Play again</button></div>`;
}

/* ---------- input ---------- */
document.addEventListener('submit',e=>{if(e.target&&e.target.id==='authform'){e.preventDefault();submitAuth()}});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,d=b.dataset;
  if(a!=='menu')S.menuConfirm=false;
  switch(a){
    case 'tab':{const e=document.getElementById('f-email'),nm=document.getElementById('f-name');if(e)S.authEmail=e.value;if(nm)S.authName=nm.value;S.authTab=d.t;S.authMsg='';break}
    case 'logout':Acct=null;S={phase:'title',day:1,threat:3};break;
    case 'acctdel':S.confirmAcct=true;break;
    case 'acctdelno':S.confirmAcct=false;break;
    case 'acctdelyes':{const id=Acct.id;Acct.q=Acct.q.then(()=>removeDoc(id)).catch(()=>{});Acct=null;S={phase:'title',day:1,threat:3};break}
    case 'pickslot':S={phase:'pick',day:1,threat:3,pendingSlot:+d.n};break;
    case 'back':S={phase:'title',day:1,threat:3};break;
    case 'load':loadSlot(+d.n);break;
    case 'del':S.confirmDel=+d.n;break;
    case 'delno':S.confirmDel=null;break;
    case 'delyes':persist(+d.n,null);S.confirmDel=null;break;
    case 'menu':if(S.menuConfirm)S={phase:'title',day:1,threat:3};else S.menuConfirm=true;break;
    case 'start':newGame(d.type,S.pendingSlot);break;
    case 'commute':doCommute(d.id);break;
    case 'toEvent':if(S.over){S.phase='end'}else if(rand()<fightChance())startFight();else{S.ev=pickEvent();S.phase='event'}break;
    case 'fight':fightAct(d.a);break;
    case 'choice':doChoice(+d.i);break;
    case 'toEvening':if(S.over){S.phase='end'}else enterEvening();break;
    case 'eve':doEve(d.id);break;
    case 'afterEve':if(S.over)S.phase='end';else if(RENT_DAYS.includes(S.day))S.phase='rent';else nextDay();break;
    case 'pay':payRent();break;
    case 'sell':sellAsset();break;
    case 'loan':takeLoan();break;
    case 'plead':plead();break;
    case 'giveup':S.over='evicted';S.phase='end';break;
    case 'restart':S={phase:'title',day:1,threat:3};break;
  }
  render();
  if(S.phase==='end'&&S.slot&&!S.savedEnd){S.savedEnd=true;saveEnded()}
  const desk=$('desk'),top=desk.getBoundingClientRect().top;
  if(top<0||top>window.innerHeight*.7)window.scrollTo({top:Math.max(0,window.scrollY+top-70),behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
});
render();
initBackend();
</script>

</body></html>
