<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Horizon — Flight Sim</title>
<style>
  :root{--ink:#eaf6ff;--muted:#9bb6c7;--panel:rgba(4,15,28,.78);--line:rgba(164,220,247,.25);--cyan:#5ee4ff;--amber:#ffc65a;--danger:#ff7878}
  *{box-sizing:border-box} body{margin:0;background:#06101b;color:var(--ink);font:14px/1.3 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
  #game{display:block;width:100vw;height:100vh;cursor:crosshair}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:18px;left:50%;transform:translateX(-50%);text-align:center;letter-spacing:.2em;font-size:11px;color:var(--muted)}
  .readout{position:absolute;top:18px;width:150px;padding:11px 14px;background:var(--panel);border:1px solid var(--line);border-radius:5px;backdrop-filter:blur(5px)}.readout.left{left:18px}.readout.right{right:18px;text-align:right}.label{display:block;color:var(--muted);font-size:10px;letter-spacing:.15em}.value{font:500 27px/1.05 ui-monospace,SFMono-Regular,Menlo,monospace}.unit{color:var(--cyan);font-size:11px}
  #status{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);padding:10px 16px;background:var(--panel);border:1px solid var(--line);border-radius:5px;text-align:center;color:var(--muted);letter-spacing:.07em;font-size:11px}.accent{color:var(--cyan)}
  #help{position:absolute;bottom:20px;left:18px;color:var(--muted);font-size:11px;line-height:1.65;text-shadow:0 1px #000}.key{display:inline-block;min-width:18px;padding:1px 4px;text-align:center;color:var(--ink);border:1px solid var(--line);border-radius:3px;font:10px ui-monospace,monospace}
  #start{pointer-events:auto;position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(16,65,91,.45),rgba(2,9,17,.94))}.modal{width:min(460px,90vw);padding:34px;text-align:center;background:rgba(5,18,33,.9);border:1px solid rgba(113,220,255,.35);border-radius:9px;box-shadow:0 20px 70px #000}.modal h1{margin:0;color:var(--cyan);font-size:36px;letter-spacing:.18em;font-weight:500}.modal p{color:var(--muted);margin:13px 0 25px}.modal button{border:1px solid var(--cyan);border-radius:4px;padding:12px 28px;background:rgba(72,209,255,.1);color:var(--ink);font:500 13px system-ui;letter-spacing:.14em;cursor:pointer}.modal button:hover{background:rgba(72,209,255,.22)}
  @media(max-width:560px){.readout{top:10px;width:118px;padding:8px}.readout.left{left:10px}.readout.right{right:10px}.value{font-size:21px}.top{top:92px}.top span{display:none}#help{display:none}#status{bottom:12px;max-width:88vw}}
</style>
</head>
<body>
<canvas id="game" aria-label="Playable Boeing 747 cockpit flight simulator"></canvas>
<div class="hud"><div class="top">HORIZON <span>· 747-400 FLIGHT DECK</span></div><div class="readout left"><span class="label">AIRSPEED</span><span class="value" id="speed">0</span> <span class="unit">KT</span></div><div class="readout right"><span class="label">ALTITUDE</span><span class="value" id="alt">0</span> <span class="unit">FT</span></div><div id="help"><span class="key">W</span>/<span class="key">S</span> pitch &nbsp; <span class="key">A</span>/<span class="key">D</span> bank<br><span class="key">↑</span>/<span class="key">↓</span> throttle &nbsp; <span class="key">R</span> restart</div><div id="status">COCKPIT VIEW · LOCATE THE <span class="accent">RUNWAY</span></div></div>
<div id="start"><div class="modal"><h1>HORIZON</h1><p>A short VFR training flight. Find the runway beyond the hills and bring the aircraft down gently.</p><button id="fly">START FLIGHT</button></div></div>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),speedEl=document.querySelector('#speed'),altEl=document.querySelector('#alt'),statusEl=document.querySelector('#status');
let W,H,dpr,keys={},running=false,last=0,landed=false,crashed=false; let plane;
function reset(){plane={x:0,y:920,z:0,yaw:.05,pitch:-.025,roll:0,v:118,throttle:.64};landed=false;crashed=false;statusEl.innerHTML='LOCATE THE <span class="accent">RUNWAY</span> · HOLD A STABLE APPROACH'}
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0)} addEventListener('resize',resize);resize();reset();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function rot(px,py,a){let q=Math.cos(a),s=Math.sin(a);return [px*q-py*s,px*s+py*q]}
function project(X,Y,Z){let dx=X-plane.x,dy=Y-plane.y,dz=Z-plane.z;let r=rot(dx,dz,plane.yaw);dx=r[0];dz=r[1];let p=rot(dy,dz,plane.pitch);dy=p[0];dz=p[1];if(dz<3)return null;let f=Math.min(W,H)*.78;return [W/2+dx/dz*f,H*.52-dy/dz*f,dz]}
function poly(points,fill,stroke){let q=points.map(p=>project(...p));if(q.some(v=>!v))return;x.beginPath();q.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.stroke()}}
function line(a,b,style,w=1){let p=project(...a),q=project(...b);if(!p||!q)return;x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(q[0],q[1]);x.strokeStyle=style;x.lineWidth=w;x.stroke()}
function update(dt){let p=plane;if(crashed){p.throttle=0;p.v=Math.max(0,p.v-28*dt);p.x+=Math.sin(p.yaw)*p.v*dt;p.z+=Math.cos(p.yaw)*p.v*dt;p.y=Math.max(p.y,groundHeight(p.x,p.z)+3);speedEl.textContent=Math.round(p.v*.87);altEl.textContent=Math.round(p.y*3.281);return}let turn=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),up=(keys.w?1:0)-(keys.s?1:0),th=(keys.arrowup?1:0)-(keys.arrowdown?1:0);p.roll=clamp(p.roll+turn*dt*1.8-p.roll*dt*2.5,-.85,.85);p.pitch=clamp(p.pitch+up*dt*.44-p.pitch*dt*.52,-.65,.25);p.throttle=clamp(p.throttle+th*dt*.35,0,1);p.v=clamp(p.v+(p.throttle*40-16-p.pitch*45)*dt,48,185);if(turn)p.yaw+=Math.sin(p.roll)*p.v*.0022*dt;p.x+=Math.sin(p.yaw)*p.v*dt;p.z+=Math.cos(p.yaw)*p.v*dt;p.y+=Math.sin(p.pitch)*p.v*dt;let ground=groundHeight(p.x,p.z);if(p.y<ground+3){let impact=-Math.sin(p.pitch)*p.v;p.y=ground+3;if(p.z>1700&&p.z<2600&&Math.abs(p.x)<50&&p.v<92&&Math.abs(p.pitch)<.09){p.v*=.985;landed=true;statusEl.innerHTML='<span class="accent">TOUCHDOWN!</span> · NICE LANDING — PRESS R TO FLY AGAIN'}else if(impact>72||p.v>155){p.pitch=.12;crashed=true;statusEl.innerHTML='<span style="color:var(--danger)">HARD LANDING</span> · AIRCRAFT DISABLED — PRESS R TO TRY AGAIN'}else{p.pitch=Math.max(.18,Math.abs(p.pitch)*.6);p.v*=.78;statusEl.innerHTML='<span class="accent">TERRAIN BOUNCE</span> · PULL UP'}}speedEl.textContent=Math.round(p.v*.87);altEl.textContent=Math.round(p.y*3.281)}
function terrainHeight(X,Z){return 22*Math.sin(X*.007+Z*.003)+12*Math.sin(Z*.011)-Math.max(0,1-Math.abs(X)/350)*Math.max(0,1-(Z-2150)*(Z-2150)/1500000)*25}
function groundHeight(X,Z){return Math.abs(X)<52&&Z>1700&&Z<2600?1:terrainHeight(X,Z)}
function tree(X,Z,h,size){let base=project(X,h,Z),tip=project(X,h+size,Z),left=project(X-size*.28,h+size*.38,Z),right=project(X+size*.28,h+size*.38,Z);if(!base||!tip||!left||!right)return;x.fillStyle='#183d27';x.beginPath();x.moveTo(tip[0],tip[1]);x.lineTo(left[0],left[1]);x.lineTo(base[0],base[1]);x.lineTo(right[0],right[1]);x.closePath();x.fill();x.strokeStyle='rgba(8,31,18,.45)';x.lineWidth=.6;x.stroke()}
function house(X,Z,h,size){poly([[X-size,h,Z-size],[X+size,h,Z-size],[X+size,h+size,Z-size],[X-size,h+size,Z-size]],'#b98760','#4c342a');poly([[X-size-3,h+size,Z-size-3],[X+size+3,h+size,Z-size-3],[X,h+size*1.62,Z-size-3]],'#7d3030','#4c342a');let w=project(X,h+size*.46,Z-size-1);if(w){x.fillStyle='#ffe9a5';x.fillRect(w[0]-2,w[1]-2,4,4)}}
function drawFire(){let fx=plane.x+Math.sin(plane.yaw)*95,fz=plane.z+Math.cos(plane.yaw)*95,q=project(fx,4,fz);if(!q)return;let t=performance.now()*.009,size=clamp(5900/q[2],28,175),base=q[1]+size*.45;x.save();x.globalCompositeOperation='screen';let glow=x.createRadialGradient(q[0],base,2,q[0],base,size*2.3);glow.addColorStop(0,'rgba(255,224,92,.88)');glow.addColorStop(.4,'rgba(255,84,18,.5)');glow.addColorStop(1,'rgba(255,40,0,0)');x.fillStyle=glow;x.beginPath();x.arc(q[0],base,size*2.3,0,7);x.fill();x.globalCompositeOperation='source-over';for(let i=0;i<12;i++){let px=q[0]+(i-5.5)*size*.2,flame=size*(.85+Math.sin(t+i*1.71)*.23+(i%3)*.12);x.fillStyle=i%2?'#e94816':'#ffb02e';x.beginPath();x.moveTo(px-size*.16,base);x.quadraticCurveTo(px-size*.12,base-flame*.68,px+Math.sin(t*1.7+i)*size*.08,base-flame);x.quadraticCurveTo(px+size*.19,base-flame*.38,px+size*.16,base);x.closePath();x.fill()}x.fillStyle='rgba(36,38,39,.36)';for(let i=0;i<5;i++){x.beginPath();x.arc(q[0]+(i-2)*size*.32,base-size*(1.25+i*.2),size*(.29+i*.1),0,7);x.fill()}x.restore()}
function drawCockpit(){let dash=H*.72,cy=H*.81;x.save();
  // Windshield structure and dark 747 glareshield.
  x.fillStyle='rgba(5,12,18,.9)';x.beginPath();x.moveTo(0,dash);x.lineTo(W*.14,dash-34);x.lineTo(W*.86,dash-34);x.lineTo(W,dash);x.lineTo(W,H);x.lineTo(0,H);x.closePath();x.fill();
  x.strokeStyle='rgba(17,28,34,.98)';x.lineWidth=14;x.beginPath();x.moveTo(W*.12,0);x.lineTo(W*.22,dash-38);x.moveTo(W*.88,0);x.lineTo(W*.78,dash-38);x.moveTo(W*.5,0);x.lineTo(W*.5,dash-38);x.stroke();
  x.fillStyle='rgba(103,170,186,.10)';x.beginPath();x.moveTo(W*.22,dash-39);x.lineTo(W*.5,dash-39);x.lineTo(W*.5,20);x.lineTo(W*.12,0);x.closePath();x.fill();x.beginPath();x.moveTo(W*.5,dash-39);x.lineTo(W*.78,dash-39);x.lineTo(W*.88,0);x.lineTo(W*.5,20);x.closePath();x.fill();
  if(crashed){x.strokeStyle='rgba(224,244,250,.78)';x.lineWidth=1.4;for(let [cx,cy] of [[W*.34,H*.25],[W*.68,H*.4]]){for(let i=0;i<8;i++){let a=i*Math.PI/4+.18;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(a)*38,cy+Math.sin(a)*38);x.lineTo(cx+Math.cos(a+.35)*49,cy+Math.sin(a+.35)*54);x.stroke()}}}
  function gauge(cx,label,val,unit,accent){x.save();x.translate(cx,cy);x.fillStyle='#071018';x.beginPath();x.arc(0,0,42,0,7);x.fill();x.strokeStyle='rgba(139,207,226,.42)';x.lineWidth=2;x.stroke();for(let i=0;i<9;i++){let a=-2.4+i*.6;x.beginPath();x.moveTo(Math.cos(a)*32,Math.sin(a)*32);x.lineTo(Math.cos(a)*37,Math.sin(a)*37);x.stroke()}let a=-2.4+clamp(val,0,1)*4.8;x.strokeStyle=accent;x.lineWidth=2.5;x.beginPath();x.moveTo(0,0);x.lineTo(Math.cos(a)*28,Math.sin(a)*28);x.stroke();x.fillStyle='#d9f3fb';x.font='500 13px ui-monospace,monospace';x.textAlign='center';x.fillText(label,0,-8);x.fillText(unit,0,20);x.restore()}
  gauge(W*.18,'N1',plane.throttle,'%', '#5ee4ff');gauge(W*.82,'PITCH',(plane.pitch+.65)/1,'°','#ffc65a');
  // Yoke follows the pilot inputs, so roll and pitch remain readable even with the panel in view.
  x.save();x.translate(W*.5,H*.91);x.rotate(-plane.roll*.42);x.strokeStyle='#1c2d35';x.lineWidth=15;x.lineCap='round';x.beginPath();x.moveTo(-72,0);x.quadraticCurveTo(0,-34-plane.pitch*55,72,0);x.stroke();x.lineWidth=10;x.beginPath();x.moveTo(0,-25);x.lineTo(0,62);x.stroke();x.restore();x.restore()}
function draw(){let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#0d4267');sky.addColorStop(.5,'#5cacc3');sky.addColorStop(.505,'#c8c893');sky.addColorStop(1,'#314b31');x.fillStyle=sky;x.fillRect(0,0,W,H);
// terrain mesh
let terrainStartZ=Math.floor(plane.z/65)*65-1850,terrainStartX=Math.floor(plane.x/85)*85-1700;for(let z=terrainStartZ;z<terrainStartZ+3700;z+=65){for(let X=terrainStartX;X<terrainStartX+3400;X+=85){let h1=terrainHeight(X,z),h2=terrainHeight(X+85,z),h3=terrainHeight(X+85,z+65),h4=terrainHeight(X,z+65);let shade=clamp(35+(h1+h2+h3+h4)/5+z/80,25,78);poly([[X,h1,z],[X+85,h2,z],[X+85,h3,z+65],[X,h4,z+65]],`rgb(${shade*.45},${shade*.88},${shade*.52})`,null);let seed=(Math.sin((X/85)*12.9898+(z/65)*78.233)*43758.5453)%1;if(seed<0)seed+=1;if(seed>.82&&Math.abs(X)>85){let tx=X+seed*70,tz=z+(1-seed)*52;tree(tx,tz,terrainHeight(tx,tz),17+seed*19)}let home=(Math.sin((X/85)*93.121+(z/65)*19.19)*12515.33)%1;if(home<0)home+=1;if(home>.992&&Math.abs(X)>150){let hx=X+home*45,hz=z+(1-home)*45;house(hx,hz,terrainHeight(hx,hz),13+home*7)}}}
// runway
poly([[-52,1,1700],[52,1,1700],[52,1,2600],[-52,1,2600]],'#313b3d','#d9d8bf');for(let z=1730;z<2570;z+=55){poly([[-3,2,z],[3,2,z],[3,2,z+27],[-3,2,z+27]],'#f5ecd0')}for(let z=1710;z<2600;z+=40){poly([[-49,2,z],[-44,2,z],[-44,2,z+18],[-49,2,z+18]],'#e9efe3');poly([[44,2,z],[49,2,z],[49,2,z+18],[44,2,z+18]],'#e9efe3')}
// landing lights
for(let z=1700;z<2610;z+=55){for(let X of [-58,58]){let q=project(X,3,z);if(q){x.fillStyle='#fff1ab';x.beginPath();x.arc(q[0],q[1],clamp(38/q[2],1,4),0,7);x.fill()}}}
// distant clouds
x.fillStyle='rgba(245,250,249,.22)';for(let i=0;i<7;i++){let q=project(-850+i*290,260+(i%3)*45,1500+i*170);if(q){x.beginPath();x.ellipse(q[0],q[1],1600/q[2],260/q[2],0,0,7);x.fill()}}
// flight reference, kept above the exterior world but behind the aircraft
x.save();x.translate(W/2,H*.52);x.rotate(-plane.roll);x.strokeStyle='rgba(232,255,251,.82)';x.lineWidth=1.4;x.beginPath();x.moveTo(-120,0);x.lineTo(-34,0);x.moveTo(34,0);x.lineTo(120,0);x.moveTo(-20,0);x.lineTo(0,10);x.lineTo(20,0);x.stroke();for(let i=-2;i<=2;i++){if(!i)continue;let yy=i*42;x.beginPath();x.moveTo(-20,yy);x.lineTo(20,yy);x.stroke()}x.restore();
// compass
let hd=((plane.yaw*180/Math.PI)%360+360)%360;x.fillStyle='rgba(2,14,24,.52)';x.fillRect(W/2-115,48,230,24);x.strokeStyle='rgba(164,220,247,.3)';x.strokeRect(W/2-115,48,230,24);x.fillStyle='#dff9ff';x.font='12px ui-monospace,monospace';x.textAlign='center';x.fillText(String(Math.round(hd)).padStart(3,'0')+'°',W/2,64);x.fillStyle='#5ee4ff';x.fillText('▾',W/2,54);if(crashed)drawFire();drawCockpit();}
function loop(t){if(!running)return;let dt=Math.min(.04,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(loop)}
document.querySelector('#fly').onclick=()=>{document.querySelector('#start').style.display='none';running=true;last=performance.now();requestAnimationFrame(loop)};
</script></body></html>
